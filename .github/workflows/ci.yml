name: CI

on:
  push:
    branches: [main, feat/procedural-assets]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy, Test, and Release Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux audio/X11 system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxcursor-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run unit and integration tests
        run: cargo test --all-targets
      - name: Build release binary
        run: cargo build --release
